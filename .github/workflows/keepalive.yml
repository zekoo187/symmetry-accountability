name: Supabase keep-alive

# Pings the database every few days so the free-tier project never sits idle
# long enough to auto-pause (which takes the app + all logins offline).
on:
  schedule:
    - cron: '17 9 */3 * *' # ~every 3 days (well inside the ~7-day idle window)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/trainers?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          echo "Supabase responded: HTTP $code"
          # Any real HTTP response (even 401/empty) counts as a request and keeps
          # the project awake. Only a network failure (000) is a problem.
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::error::No response from Supabase — project may be paused or down."
            exit 1
          fi
